<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoApp</title>
    <style>
        /* Reset + Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8, #d9e4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .todo-container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px 50px;
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #2b3a55;
            margin-bottom: 25px;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        #input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dcdfe3;
            border-radius: 8px;
            outline: none;
            transition: 0.3s ease;
            font-size: 1rem;
        }

        #input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 5px rgba(108, 99, 255, 0.3);
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #6c63ff;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #574fe4;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f7f8fc;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s ease;
        }

        li:hover {
            background: #eef1f7;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5c5c;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .delete-btn:hover {
            color: #ff2e2e;
        }
    </style>
</head>

<body>
    <div class="todo-container">
        <h1>My To-Do List</h1>
        <div class="input-group">
            <input type="text" placeholder="Enter a new task..." id="input" required>
            <button onclick="addTodo()">Add</button>
        </div>
        <ul id="ol"></ul>
    </div>

    <script src="./app.js">
      
    </script>
</body>

</html>
